server:
  port: 8090

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/patericar_db
    username: patericar
    password: patericar_dev_2026
    hikari:
      maximum-pool-size: 5
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

  mail:
    host: localhost
    port: 1025
    username: ""
    password: ""
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

management:
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false

logging:
  level:
    ma.patericar: DEBUG
    org.springframework.security: DEBUG
    org.flywaydb: INFO

jwt:
  secret: dev_secret_change_in_prod_min_256_bits_long_for_hs256_algorithm_x7k9m
  expiration-ms: 86400000
  refresh-expiration-ms: 604800000

app:
  storage:
    base-path: ./storage/uploads
  cors:
    allowed-origins:
      - http://localhost:4200
      - http://localhost:4201
