spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: false
  mail:
    host: localhost
    port: 1025
    username: ""
    password: ""
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

management:
  health:
    mail:
      enabled: false

jwt:
  secret: test_secret_key_for_unit_tests_only_minimum_32_characters_long_xyz
  expiration-ms: 86400000
  refresh-expiration-ms: 604800000

app:
  storage:
    base-path: ./target/test-uploads
  cors:
    allowed-origins:
      - http://localhost:4200

server:
  port: 0
