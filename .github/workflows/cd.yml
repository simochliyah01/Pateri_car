name: CD

# Trigger only on direct pushes to main (typically a merge from develop)
on:
  push:
    branches: [ main ]
  workflow_dispatch:   # allow manual triggers from the Actions UI

# Cancel older runs if multiple pushes hit main in quick succession
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false   # don't cancel deployments mid-push

# Permissions required to push to GHCR using GITHUB_TOKEN
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}   # lowercase by default for ghcr
  BACKEND_IMAGE: pateri-car-backend
  FRONTEND_IMAGE: pateri-car-frontend

jobs:
  # ============================================================
  # 1. Re-run tests on main (defense in depth)
  # ============================================================
  test:
    name: Re-run tests on main
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 with Maven cache
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Backend tests
        working-directory: backend
        run: mvn -B verify

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-client/package-lock.json

      - name: Frontend dependencies
        working-directory: frontend-client
        run: npm ci --legacy-peer-deps

      - name: Frontend tests
        working-directory: frontend-client
        run: npm run test:ci

  # ============================================================
  # 2. Publish images to GitHub Container Registry
  # ============================================================
  publish:
    name: Publish Docker images to GHCR
    runs-on: ubuntu-latest
    needs: [ test ]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Lowercase the owner because ghcr requires lowercase image paths
      - name: Set lowercase image owner
        id: vars
        run: echo "owner_lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------- BACKEND ----------
      - name: Backend — extract image metadata (tags + labels)
        id: meta_backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner_lc }}/${{ env.BACKEND_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - name: Backend — build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta_backend.outputs.tags }}
          labels: ${{ steps.meta_backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      # ---------- FRONTEND ----------
      - name: Frontend — extract image metadata (tags + labels)
        id: meta_frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner_lc }}/${{ env.FRONTEND_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - name: Frontend — build and push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend-client
          file: ./frontend-client/Dockerfile
          push: true
          tags: ${{ steps.meta_frontend.outputs.tags }}
          labels: ${{ steps.meta_frontend.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      # ---------- SUMMARY ----------
      - name: Image publish summary
        run: |
          {
            echo "## Docker images published to GHCR"
            echo ""
            echo "### Backend"
            echo '```'
            echo "${{ steps.meta_backend.outputs.tags }}"
            echo '```'
            echo ""
            echo "### Frontend"
            echo '```'
            echo "${{ steps.meta_frontend.outputs.tags }}"
            echo '```'
            echo ""
            echo "### Pull commands"
            echo '```bash'
            echo "docker pull ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner_lc }}/${{ env.BACKEND_IMAGE }}:latest"
            echo "docker pull ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner_lc }}/${{ env.FRONTEND_IMAGE }}:latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
