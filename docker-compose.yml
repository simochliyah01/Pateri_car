services:
  postgres:
    image: postgres:15-alpine
    container_name: patericar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: patericar_db
      POSTGRES_USER: patericar
      POSTGRES_PASSWORD: patericar_dev_2026
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patericar -d patericar_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
    name: patericar_postgres_data
