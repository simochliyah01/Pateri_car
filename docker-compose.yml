name: patericar

# ─── Volumes ─────────────────────────────────────────────────────────────────
# Named volumes are managed by Docker and persist across container restarts.
# postgres_data  → PostgreSQL data directory
# backend_uploads → car images uploaded via the admin panel
volumes:
  postgres_data:
    name: patericar_postgres_data
  backend_uploads:
    name: patericar_backend_uploads

# ─── Networks ────────────────────────────────────────────────────────────────
# All services share one isolated bridge network.
# Containers communicate using their service names as hostnames
# (e.g. backend connects to postgres at host "postgres").
networks:
  patericar-network:
    driver: bridge

# ─── Services ────────────────────────────────────────────────────────────────
services:

  # ── PostgreSQL database ────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: patericar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA:            /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - patericar-network

  # ── Spring Boot backend API ────────────────────────────────────────────────
  # Built from ./backend/Dockerfile (multi-stage: Maven build → JRE Alpine).
  # Waits for postgres to pass its healthcheck before starting.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: patericar-backend:local
    container_name: patericar-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Hostname "postgres" resolves inside the Docker network
      DB_URL:                jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USER:               ${POSTGRES_USER}
      DB_PASSWORD:           ${POSTGRES_PASSWORD}
      JWT_SECRET:            ${JWT_SECRET}
      FRONTEND_CLIENT_URL:   ${FRONTEND_CLIENT_URL:-http://localhost}
      FRONTEND_ADMIN_URL:    ${FRONTEND_ADMIN_URL:-http://localhost}
      # Mail — defaults to disabled/localhost; override in .env for real SMTP
      MAIL_HOST:             ${MAIL_HOST:-localhost}
      MAIL_PORT:             ${MAIL_PORT:-1025}
      MAIL_USERNAME:         ${MAIL_USERNAME:-}
      MAIL_PASSWORD:         ${MAIL_PASSWORD:-}
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      # Persist uploaded car images across container restarts
      - backend_uploads:/app/storage/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/api/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - patericar-network

  # ── Angular frontend (Nginx) ───────────────────────────────────────────────
  # Built from ./frontend-client/Dockerfile (Node build → Nginx Alpine).
  # Nginx proxies /api/ requests to the backend service.
  # Waits for the backend to pass its healthcheck before starting.
  frontend-client:
    build:
      context: ./frontend-client
      dockerfile: Dockerfile
    image: patericar-frontend-client:local
    container_name: patericar-frontend-client
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - patericar-network
